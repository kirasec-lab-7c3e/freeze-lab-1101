merge_protections:
  - name: business-hours only
    description: production merges only Mon-Fri 09:00-17:00 Paris
    if:
      - base=main
    success_conditions:
      - "schedule=Mon-Fri 09:00-17:00[Europe/Paris]"
pull_request_rules:
  - name: automatic merge
    conditions:
      - base=main
      - label=ready
    actions:
      merge: {}
